<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Object Detection Protocols</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

video, canvas {
  position: fixed;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.title {
  position: fixed;
  top: 20px;
  left: 20px;
  color: #00ff00;
  font-weight: bold;
  font-size: 18px;
  z-index: 10;
}
</style>
</head>

<body>

<div class="title">OBJECT DETECTION PROTOCOLS — by humdrum</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let model;

// objetos permitidos
const allowedObjects = [
  "cell phone",
  "bottle",
  "chair",
  "person",
  "laptop",
  "tv",
  "book"
];

// colores tipo YOLO
const colors = {
  "cell phone": "#00ff00",
  "bottle": "#ff0000",
  "chair": "#00ffff",
  "person": "#ffff00",
  "laptop": "#ff00ff",
  "tv": "#ff8800",
  "book": "#00ff88"
};

// etiquetas conceptuales
function mapLabel(object) {
  if (object === "cell phone") {
    const options = [
      "contemporary dependency",
      "attention trap",
      "surveillance surface"
    ];
    return options[Math.floor(Math.random() * options.length)];
  }
  if (object === "chair") return "body support structure";
  if (object === "bottle") return "consumption unit";
  if (object === "person") return "unstable subject";
  if (object === "laptop") return "digital extension";
  if (object === "tv") return "passive consumption interface";
  if (object === "book") return "knowledge container";

  return "unresolved category";
}

// cámara
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
    audio: false
  });
  video.srcObject = stream;
}

// resize
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// detecciones persistentes (🔥 clave)
let trackedObjects = [];

// detectar (cada 200ms)
async function detect() {
  const predictions = await model.detect(video);

  trackedObjects = [];

  predictions.forEach(pred => {
    if (pred.score > 0.75 && allowedObjects.includes(pred.class)) {
      trackedObjects.push({
        bbox: pred.bbox,
        class: pred.class,
        score: pred.score,
        label: mapLabel(pred.class)
      });
    }
  });

  setTimeout(detect, 200); // 🔥 rápido pero estable
}

// dibujar SIEMPRE (fluido)
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  trackedObjects.forEach(obj => {
    const [x, y, w, h] = obj.bbox;

    const color = colors[obj.class] || "#00ff00";

    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    const text = `${obj.label} ${obj.score.toFixed(2)}`;

    ctx.font = "16px Arial";
    const textWidth = ctx.measureText(text).width;

    ctx.fillStyle = color;
    ctx.fillRect(x, y - 25, textWidth + 10, 25);

    ctx.fillStyle = "black";
    ctx.fillText(text, x + 5, y - 7);
  });

  requestAnimationFrame(draw); // 🔥 fluidez real
}

// init
async function init() {
  await startCamera();
  model = await cocoSsd.load();
  detect();
  draw();
}

init();
</script>

</body>
</html>
