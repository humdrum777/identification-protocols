<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Expanded Taxonomy — by humdrum</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* ----- GLOBAL ----- */
  body {
    background: #000;
    font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ----- WELCOME SCREEN (AZUL ELÉCTRICO) ----- */
  .welcome-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #1e22ff;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease, visibility 0.4s;
    padding: 2rem;
  }

  .welcome-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .welcome-content {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* TÍTULO PRINCIPAL - MÁS CHICO */
  .main-title {
    font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 7vw, 3.2rem);
    letter-spacing: -0.01em;
    color: white;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
    line-height: 1.2;
  }

  /* SUBTÍTULO */
  .sub-title {
    font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
    font-weight: 500;
    font-size: clamp(0.8rem, 3.5vw, 1rem);
    letter-spacing: 0.2em;
    color: white;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    opacity: 0.9;
  }

  /* STATEMENT */
  .statement {
    font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
    font-weight: 400;
    font-size: clamp(1rem, 4vw, 1.3rem);
    line-height: 1.5;
    color: white;
    text-align: center;
    max-width: 550px;
    margin: 0 auto 2.5rem auto;
    padding: 0 1rem;
  }

  .statement p {
    margin: 0;
  }

  /* BOTÓN */
  .activate-btn {
    background: transparent;
    border: 2px solid white;
    color: white;
    font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
    font-size: clamp(1rem, 4vw, 1.1rem);
    font-weight: 500;
    text-transform: lowercase;
    padding: 0.9rem 2.5rem;
    cursor: pointer;
    transition: all 0.2s ease;
    background-color: transparent;
    border-radius: 0px;
  }

  .activate-btn:hover {
    background-color: white;
    color: #1e22ff;
    border-color: white;
  }

  .activate-btn:active {
    transform: scale(0.97);
  }

  html, body {
    overflow: hidden;
    height: 100%;
  }

  /* ----- DETECTION INTERFACE - LIMPIA, SIN TEXTOS EXTRA ----- */
  .detection-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    background: #000;
  }

  video, canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  video {
    z-index: 1;
  }

  canvas {
    z-index: 2;
    pointer-events: none;
  }

  /* SOLO EL TÍTULO MINIMAL (sin fondo extra, solo letras) */
  .detection-title {
    position: fixed;
    top: 18px;
    left: 18px;
    color: #ccff00;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 10;
    font-family: 'Inter', monospace;
    background: transparent;
    padding: 0;
    text-shadow: 0 0 4px rgba(0,0,0,0.5);
  }

  /* Botón EXIT igualmente limpio */
  .exit-btn {
    position: fixed;
    top: 18px;
    right: 18px;
    background: transparent;
    border: 1px solid rgba(204, 255, 0, 0.7);
    color: #ccff00;
    padding: 5px 12px;
    font-size: 10px;
    font-family: 'Inter', monospace;
    cursor: pointer;
    z-index: 12;
    font-weight: 500;
    letter-spacing: 0.5px;
    backdrop-filter: blur(2px);
  }

  .exit-btn:active {
    background: #ccff20;
    color: #000;
  }

  /* Toast solo para errores o eventos breves */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #ccff00;
    padding: 8px 18px;
    font-size: 13px;
    font-family: 'Inter', monospace;
    z-index: 15;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    border: 1px solid #ccff00;
    border-radius: 0px;
    font-weight: 500;
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; }

  /* Ocultar elementos que no se usan */
  .hide { display: none; }
  
  /* No hay status extra ni fps en la interfaz */
</style>
</head>
<body>

<!-- PANTALLA DE INICIO (azul eléctrico, título más chico) -->
<div id="welcomeScreen" class="welcome-screen">
  <div class="welcome-content">
    <div class="main-title">EXPANDED TAXONOMY</div>
    <div class="sub-title">BY HUMDRUM</div>
    <div class="statement">
      <p>A system where classification expands beyond control,</p>
      <p>generating unstable meanings.</p>
    </div>
    <button id="activateCameraBtn" class="activate-btn">activate camera</button>
  </div>
</div>

<!-- INTERFAZ DE DETECCIÓN - LIMPIA, SOLO TÍTULO Y EXIT -->
<div id="detectionContainer" class="detection-container" style="display: none;">
  <div class="detection-title">EXPANDED TAXONOMY // by humdrum</div>
  <button id="exitToWelcomeBtn" class="exit-btn">EXIT</button>
  <div id="toastMsg" class="toast"></div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

<script>
// ============================================================
// EXPANDED TAXONOMY - unstable meanings
// Taxonomía expandida con labels legibles en móvil (texto más claro)
// ============================================================
const taxonomy = {
  "cell phone": { labels: ["contemporary dependency", "attention trap", "surveillance surface"], color: "#3bc9db" },
  "laptop": { labels: ["data extraction point", "digital extension", "portable interface"], color: "#3bc9db" },
  "tv": { labels: ["passive consumption interface", "attention controller", "visual sedation"], color: "#3bc9db" },
  "remote": { labels: ["control extension", "command surface", "volition proxy"], color: "#3bc9db" },
  "camera": { labels: ["surveillance surface", "image capture device", "reality encoder"], color: "#3bc9db" },
  "headphones": { labels: ["isolation device", "intimate interface", "audio capsule"], color: "#3bc9db" },
  "mouse": { labels: ["pointing device", "digital extension", "cursor origin"], color: "#3bc9db" },
  "keyboard": { labels: ["input surface", "text generator", "linguistic interface"], color: "#3bc9db" },
  "chair": { labels: ["body support structure", "domestic infrastructure", "posture enforcer"], color: "#ffb347" },
  "couch": { labels: ["comfort zone", "habitual contact zone", "rest device"], color: "#ffb347" },
  "bed": { labels: ["rest device", "body reset system", "sleep surface"], color: "#ffb347" },
  "mirror": { labels: ["reflective interface", "unstable subject", "identity split"], color: "#ffb347" },
  "dining table": { labels: ["supporting surface", "domestic infrastructure", "gathering interface"], color: "#ff6b6b" },
  "cup": { labels: ["repetitive use object", "maintenance object", "drinking interface"], color: "#ff6b6b" },
  "wine glass": { labels: ["consumption ritual object", "fragile container", "celebration vessel"], color: "#ff6b6b" },
  "bottle": { labels: ["consumption unit", "liquid container", "portable hydration"], color: "#ff6b6b" },
  "refrigerator": { labels: ["preservation system", "cold storage", "thermal archive"], color: "#ff6b6b" },
  "oven": { labels: ["transformation device", "heat interface", "alchemical chamber"], color: "#ff6b6b" },
  "door": { labels: ["access control point", "threshold interface", "liminal boundary"], color: "#6bdb6b" },
  "window": { labels: ["visual interface", "external connection", "light aperture"], color: "#6bdb6b" },
  "stairs": { labels: ["vertical movement system", "transition structure", "elevation device"], color: "#6bdb6b" },
  "lamp": { labels: ["artificial environment control", "light emitter", "darkness negotiator"], color: "#6bdb6b" },
  "car": { labels: ["mobility system", "controlled movement capsule", "urban prosthesis"], color: "#c084fc" },
  "bicycle": { labels: ["alternative mobility", "manual transport", "urban interface"], color: "#c084fc" },
  "bus": { labels: ["collective mobility", "mass transport unit", "public vein"], color: "#c084fc" },
  "traffic light": { labels: ["behavioral conditioning device", "urban regulator", "chromatic command"], color: "#c084fc" },
  "backpack": { labels: ["personal storage system", "portable container", "burden distributor"], color: "#c084fc" },
  "person": { labels: ["unstable subject", "non-fixed entity", "identity in transit"], color: "#e6ff70" },
  "hand": { labels: ["gesture interface", "manipulation tool", "precise actuator"], color: "#e6ff70" },
  "book": { labels: ["knowledge container", "information storage", "portable memory"], color: "#b0b0b0" },
  "scissors": { labels: ["functional extension", "cutting tool", "separation device"], color: "#b0b0b0" },
  "knife": { labels: ["functional extension", "cutting interface", "edge negotiator"], color: "#b0b0b0" },
  "clock": { labels: ["time control device", "temporal interface", "rhythm enforcer"], color: "#b0b0b0" },
  "plant": { labels: ["organic presence", "living object", "photosynthetic surface"], color: "#b0b0b0" },
  "food": { labels: ["consumption unit", "nutritional interface", "caloric source"], color: "#b0b0b0" },
  "default": { labels: ["misclassified object", "unresolved category", "unstable presence", "taxonomy leak"], color: "#dddddd" }
};

function getExpandedLabel(className) {
  const entry = taxonomy[className] || taxonomy.default;
  const labels = entry.labels;
  return labels[Math.floor(Math.random() * labels.length)];
}
function getTaxonomyColor(className) {
  return (taxonomy[className] || taxonomy.default).color;
}

// ========== DOM ==========
const welcomeScreen = document.getElementById('welcomeScreen');
const detectionContainer = document.getElementById('detectionContainer');
const activateBtn = document.getElementById('activateCameraBtn');
const exitBtn = document.getElementById('exitToWelcomeBtn');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const toastDiv = document.getElementById('toastMsg');

let model = null;
let detectionInterval = null;
let animationFrame = null;
let stream = null;
let isDetecting = false;
let detectedObjects = [];

function showToast(msg, isErr = false) {
  toastDiv.textContent = msg;
  toastDiv.style.color = isErr ? "#ffaaaa" : "#ccff00";
  toastDiv.classList.add('show');
  setTimeout(() => toastDiv.classList.remove('show'), 2000);
}

// ========== CÁMARA TRASERA ==========
async function startBackCamera() {
  try {
    let constraints = {
      video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    };
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (fallback) {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1024 } }
      });
    }
    video.srcObject = stream;
    video.setAttribute('playsinline', '');
    video.muted = true;
    await video.play();
    await new Promise(resolve => {
      if (video.videoWidth) resolve();
      else video.onloadedmetadata = () => resolve();
    });
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    showToast("camera ready");
    return true;
  } catch (err) {
    console.error(err);
    showToast("camera access failed", true);
    return false;
  }
}

function stopTracks() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
}

// ========== MODELO ==========
async function loadModel() {
  try {
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    return true;
  } catch(e) {
    console.error(e);
    showToast("failed to load AI model", true);
    return false;
  }
}

// ========== DETECCIÓN ==========
async function runDetection() {
  if (!model || !video.videoWidth || !isDetecting) return;
  try {
    const predictions = await model.detect(video);
    const newObjs = [];
    for (let p of predictions) {
      if (p.score > 0.55) {
        const cls = p.class.toLowerCase();
        newObjs.push({
          bbox: p.bbox,
          class: cls,
          score: p.score,
          label: getExpandedLabel(cls),
          color: getTaxonomyColor(cls)
        });
      }
    }
    detectedObjects = newObjs;
  } catch(e) { console.warn(e); }
}

// ========== DIBUJO con textos MÁS GRANDES y legibles en móvil ==========
function draw() {
  if (!canvas.width || !canvas.height) {
    animationFrame = requestAnimationFrame(draw);
    return;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  for (let obj of detectedObjects) {
    const [x, y, w, h] = obj.bbox;
    const color = obj.color;
    const conf = Math.floor(obj.score * 100);
    // Texto más claro: label + confianza
    const labelText = `${obj.label} ${conf}%`;
    
    // Bounding box más gruesa para mejor visibilidad
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);
    
    // Esquinas más grandes (estética YOLO)
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    const corner = 14;
    ctx.moveTo(x, y + corner); ctx.lineTo(x, y); ctx.lineTo(x + corner, y);
    ctx.moveTo(x + w - corner, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + corner);
    ctx.moveTo(x + w, y + h - corner); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - corner, y + h);
    ctx.moveTo(x, y + h - corner); ctx.lineTo(x, y + h); ctx.lineTo(x + corner, y + h);
    ctx.stroke();
    
    // FUENTE MÁS GRANDE para legibilidad en celular (14px en lugar de 11px)
    ctx.font = "bold 15px 'Inter', 'Courier New', monospace";
    const textWidth = ctx.measureText(labelText).width;
    const padding = 10;
    let labelY = y - 8;
    let rectY = y - 30;
    if (rectY < 0) {
      rectY = y + h + 6;
      labelY = rectY + 22;
    }
    // Fondo sólido con opacidad para mejor contraste
    ctx.fillStyle = color;
    ctx.fillRect(x, rectY, textWidth + padding, 24);
    ctx.fillStyle = "#000000";
    ctx.font = "bold 14px 'Inter', 'Courier New', monospace";
    ctx.fillText(labelText, x + 5, labelY + 4);
  }
  animationFrame = requestAnimationFrame(draw);
}

function shutdownDetection() {
  isDetecting = false;
  if (detectionInterval) clearInterval(detectionInterval);
  if (animationFrame) cancelAnimationFrame(animationFrame);
  stopTracks();
  detectedObjects = [];
  if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ========== ACTIVAR SISTEMA ==========
async function activateFullSystem() {
  welcomeScreen.classList.add('hidden');
  detectionContainer.style.display = 'block';
  
  shutdownDetection();
  
  if (!model) {
    const ok = await loadModel();
    if (!ok) return;
  }
  const camOk = await startBackCamera();
  if (!camOk) return;
  
  isDetecting = true;
  // intervalo más frecuente para mejor respuesta
  detectionInterval = setInterval(() => {
    if (isDetecting) runDetection();
  }, 200);
  draw();
  showToast("detection active");
}

function returnToWelcome() {
  shutdownDetection();
  detectionContainer.style.display = 'none';
  welcomeScreen.classList.remove('hidden');
  detectedObjects = [];
  if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ========== EVENTOS ==========
activateBtn.addEventListener('click', activateFullSystem);
exitBtn.addEventListener('click', returnToWelcome);

// Precarga silenciosa del modelo
(async () => {
  try {
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    console.log("model ready");
  } catch(e) { console.warn(e); }
})();

window.addEventListener('resize', () => {
  if (video && video.videoWidth && detectionContainer.style.display === 'block') {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
});
</script>
</body>
</html>
