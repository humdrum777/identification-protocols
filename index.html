<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Object Detection Protocols — by humdrum</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000000;
  overflow: hidden;
  font-family: 'Courier New', 'SF Mono', monospace;
}

video, canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

video {
  z-index: 1;
}

canvas {
  z-index: 2;
  pointer-events: none;
}

#title {
  position: fixed;
  top: 20px;
  left: 20px;
  color: #00ffcc;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  z-index: 10;
  background: rgba(0,0,0,0.6);
  padding: 8px 16px;
  backdrop-filter: blur(4px);
  font-family: monospace;
  border-left: 3px solid #00ffcc;
}

#status {
  position: fixed;
  bottom: 20px;
  left: 20px;
  color: rgba(255,255,255,0.6);
  font-size: 10px;
  font-family: monospace;
  z-index: 10;
  background: rgba(0,0,0,0.5);
  padding: 6px 12px;
  border-radius: 4px;
}

#fps-counter {
  position: fixed;
  bottom: 20px;
  right: 20px;
  color: #00ffcc;
  font-size: 10px;
  font-family: monospace;
  z-index: 10;
  background: rgba(0,0,0,0.5);
  padding: 6px 12px;
  border-radius: 4px;
}

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: #00ffcc;
  padding: 8px 16px;
  border-radius: 30px;
  font-size: 11px;
  font-family: monospace;
  z-index: 15;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
}
</style>
</head>

<body>

<div id="title">OBJECT DETECTION PROTOCOLS // by humdrum</div>
<div id="status">[ initializing camera... ]</div>
<div id="fps-counter">fps: --</div>
<div id="toast" class="toast"></div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
// ============================================
// OBJECT TAXONOMY (conceptual mapping)
// ============================================
const objectTaxonomy = {
  // 📱 TECHNOLOGY
  "cell phone": { 
    labels: ["contemporary dependency", "attention trap", "surveillance surface"],
    color: "#00ffcc"
  },
  "laptop": { 
    labels: ["data extraction point", "digital extension", "portable interface"],
    color: "#00ffcc"
  },
  "tv": { 
    labels: ["passive consumption interface", "attention controller", "visual sedation device"],
    color: "#00ffcc"
  },
  "remote": { 
    labels: ["control extension", "command surface"],
    color: "#00ffcc"
  },
  
  // 🪑 FURNITURE / BODY SUPPORT
  "chair": { 
    labels: ["body support structure", "posture enforcer", "domestic infrastructure"],
    color: "#ffaa00"
  },
  "couch": { 
    labels: ["comfort zone", "habitual contact zone", "rest device"],
    color: "#ffaa00"
  },
  "bed": { 
    labels: ["rest device", "body reset system", "sleep surface"],
    color: "#ffaa00"
  },
  "dining table": { 
    labels: ["supporting surface", "domestic infrastructure"],
    color: "#ffaa00"
  },
  
  // 🍽️ CONSUMPTION
  "bottle": { 
    labels: ["consumption unit", "liquid container", "portable hydration"],
    color: "#ff3366"
  },
  "cup": { 
    labels: ["repetitive use object", "maintenance object", "drinking interface"],
    color: "#ff3366"
  },
  "wine glass": { 
    labels: ["consumption ritual object", "fragile container"],
    color: "#ff3366"
  },
  
  // 👤 HUMAN / BODY
  "person": { 
    labels: ["unstable subject", "non-fixed entity", "identity in transit"],
    color: "#ffff00"
  },
  
  // 🚗 MOBILITY
  "car": { 
    labels: ["mobility system", "controlled movement capsule", "urban prosthesis"],
    color: "#ff8800"
  },
  "bicycle": { 
    labels: ["alternative mobility", "manual transport", "urban interface"],
    color: "#ff8800"
  },
  "bus": { 
    labels: ["collective mobility", "mass transport unit"],
    color: "#ff8800"
  },
  
  // 📚 KNOWLEDGE / MEDIA
  "book": { 
    labels: ["knowledge container", "information storage", "portable memory"],
    color: "#aa66ff"
  },
  "laptop": { 
    labels: ["digital extension", "data extraction point"],
    color: "#aa66ff"
  },
  
  // 🔧 TOOLS
  "scissors": { 
    labels: ["functional extension", "cutting tool"],
    color: "#66ffaa"
  },
  "knife": { 
    labels: ["functional extension", "cutting interface"],
    color: "#66ffaa"
  },
  
  // 🏠 ARCHITECTURE
  "door": { 
    labels: ["access control point", "threshold interface"],
    color: "#88aaff"
  },
  "window": { 
    labels: ["visual interface", "external connection", "light aperture"],
    color: "#88aaff"
  },
  
  // DEFAULT
  "default": {
    labels: ["misclassified object", "unresolved category", "unstable presence"],
    color: "#ffffff"
  }
};

// Get random label from array
function getRandomLabel(objClass) {
  const taxonomy = objectTaxonomy[objClass] || objectTaxonomy.default;
  const labels = taxonomy.labels;
  return labels[Math.floor(Math.random() * labels.length)];
}

function getColor(objClass) {
  return (objectTaxonomy[objClass] || objectTaxonomy.default).color;
}

// ============================================
// CAMERA SETUP (back camera)
// ============================================
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusDiv = document.getElementById("status");
const fpsDiv = document.getElementById("fps-counter");
const toastDiv = document.getElementById("toast");

let model = null;
let detectionInterval = null;
let frameCount = 0;
let lastFpsUpdate = 0;
let currentFPS = 0;
let detectedObjects = [];

function showMessage(msg, isError = false) {
  toastDiv.textContent = msg;
  toastDiv.style.color = isError ? "#ff6666" : "#00ffcc";
  toastDiv.classList.add("show");
  setTimeout(() => {
    toastDiv.classList.remove("show");
  }, 2500);
}

async function startCamera() {
  try {
    statusDiv.textContent = "[ requesting camera access... ]";
    
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: "environment",  // 🔥 cámara trasera
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    
    video.srcObject = stream;
    video.setAttribute("playsinline", "");
    video.muted = true;
    
    await video.play();
    
    // Esperar dimensiones
    await new Promise(r => {
      if (video.videoWidth) r();
      else video.onloadedmetadata = r;
    });
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    statusDiv.textContent = "[ camera ready. detecting objects... ]";
    showMessage("camera ready");
    
  } catch(e) {
    console.error(e);
    statusDiv.textContent = "[ error: camera permission required ]";
    showMessage("camera permission required", true);
  }
}

// ============================================
// DETECTION ENGINE
// ============================================
async function loadModel() {
  statusDiv.textContent = "[ loading detection model... ]";
  model = await cocoSsd.load();
  statusDiv.textContent = "[ model loaded. waiting for camera... ]";
}

async function runDetection() {
  if (!model || !video.videoWidth) return;
  
  try {
    const predictions = await model.detect(video);
    
    // Filter by confidence (min 0.6)
    const newObjects = [];
    predictions.forEach(pred => {
      if (pred.score > 0.6) {
        newObjects.push({
          bbox: pred.bbox,
          class: pred.class.toLowerCase(),
          score: pred.score,
          label: getRandomLabel(pred.class.toLowerCase()),
          color: getColor(pred.class.toLowerCase())
        });
      }
    });
    
    detectedObjects = newObjects;
    
    // Update FPS
    frameCount++;
    const now = performance.now();
    if (now - lastFpsUpdate >= 1000) {
      currentFPS = frameCount;
      fpsDiv.textContent = `fps: ${currentFPS}`;
      frameCount = 0;
      lastFpsUpdate = now;
    }
    
  } catch(e) {
    console.warn("Detection error:", e);
  }
}

// ============================================
// DRAWING ENGINE (YOLO style)
// ============================================
function draw() {
  if (!canvas.width || !canvas.height) {
    requestAnimationFrame(draw);
    return;
  }
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw detected objects
  detectedObjects.forEach(obj => {
    const [x, y, w, h] = obj.bbox;
    const color = obj.color;
    
    // 🔥 Bounding box (YOLO style)
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x, y, w, h);
    
    // Corner markers (computational aesthetic)
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    const cornerLen = 12;
    ctx.moveTo(x, y + cornerLen); ctx.lineTo(x, y); ctx.lineTo(x + cornerLen, y);
    ctx.moveTo(x + w - cornerLen, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cornerLen);
    ctx.moveTo(x + w, y + h - cornerLen); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - cornerLen, y + h);
    ctx.moveTo(x, y + h - cornerLen); ctx.lineTo(x, y + h); ctx.lineTo(x + cornerLen, y + h);
    ctx.stroke();
    
    // 🔥 Label background
    const labelText = `${obj.label} ${(obj.score * 100).toFixed(0)}%`;
    ctx.font = "bold 12px 'Courier New', monospace";
    const textWidth = ctx.measureText(labelText).width;
    const padding = 8;
    
    let labelY = y - 8;
    let rectY = y - 26;
    
    if (rectY < 0) {
      rectY = y + h + 4;
      labelY = rectY + 18;
    }
    
    ctx.fillStyle = color;
    ctx.fillRect(x, rectY, textWidth + padding, 22);
    ctx.fillStyle = "#000000";
    ctx.fillText(labelText, x + 4, labelY);
  });
  
  requestAnimationFrame(draw);
}

// ============================================
// INITIALIZATION
// ============================================
async function init() {
  await loadModel();
  await startCamera();
  
  // Start detection loop (every 250ms for performance)
  setInterval(() => {
    runDetection();
  }, 250);
  
  // Start drawing loop
  draw();
  
  // Resize handler
  window.addEventListener("resize", () => {
    if (video.videoWidth && video.videoHeight) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }
  });
}

init();
</script>
</body>
</html>
